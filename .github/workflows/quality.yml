name: Quality

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # commitlint 需要读取本次推送范围内的完整提交历史
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint commit messages
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          git merge-base --is-ancestor ${{ github.event.before }} ${{ github.sha }}
          if ($LASTEXITCODE -eq 0) {
            npx commitlint --from ${{ github.event.before }} --to ${{ github.sha }}
          } else {
            Write-Host '::warning::推送前的提交不在当前历史中（force-push），仅校验最新提交'
            npx commitlint --from HEAD~1 --to HEAD
          }

      - name: Quality checks
        run: npm run check
